<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CLASSIFIED: ORBITAL COMMAND</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; color: #00ff00; font-family: 'Courier New', Courier, monospace; overflow: hidden; user-select: none; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; background: #000; transition: opacity 1s; }
        h1 { font-size: 8vw; letter-spacing: 5px; text-align: center; color: #ff0000; text-shadow: 0 0 15px #ff0000; margin-bottom: 40px; }
        button { padding: 20px 40px; background: transparent; border: 2px solid #ff0000; color: #ff0000; font-size: 5vw; font-weight: bold; cursor: pointer; letter-spacing: 3px; transition: 0.3s; text-transform: uppercase; box-shadow: 0 0 10px #ff0000 inset; }
        button:hover { background: #ff0000; color: #000; }
        @media (min-width: 768px) { h1 { font-size: 3rem; } button { font-size: 1.5rem; } }

        #map-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: none; }
        #map { width: 100%; height: 100%; filter: sepia(100%) hue-rotate(90deg) saturate(250%) contrast(180%); transition: filter 0.2s; }
        .thermal-mode { filter: invert(100%) hue-rotate(180deg) saturate(500%) contrast(200%) !important; }

        .lens-dirt { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 15; pointer-events: none; box-shadow: inset 0 0 15vw rgba(0,0,0,0.9); background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E"); }

        .scanlines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); background-size: 100% 4px, 3px 100%; z-index: 20; pointer-events: none; opacity: 0.7; }
        .cam-ui { position: absolute; z-index: 30; color: #ff0000; font-weight: bold; pointer-events: none; text-shadow: 0 0 5px #ff0000; }
        #rec { top: 20px; left: 20px; font-size: 1.5rem; animation: blink 1s infinite; }
        #coords { top: 20px; right: 20px; font-size: 1rem; text-align: right; color: lime; text-shadow: 0 0 5px lime; }
        #data-stream { position: absolute; top: 80px; right: 20px; width: 80px; height: 50vh; overflow: hidden; z-index: 30; color: rgba(0, 255, 0, 0.7); font-size: 0.7rem; text-align: right; pointer-events: none; line-height: 1.2; }

        #center-ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 30; pointer-events: none; }
        #radar { position: absolute; top: -150px; left: -150px; width: 300px; height: 300px; border-radius: 50%; border: 1px solid rgba(0, 255, 0, 0.2); background: conic-gradient(from 0deg, transparent 70%, rgba(0, 255, 0, 0.4) 100%); animation: spin 2s linear infinite; }
        #crosshair { position: absolute; top: -25px; left: -25px; width: 50px; height: 50px; border: 2px solid rgba(255, 0, 0, 0.9); border-radius: 50%; }
        #crosshair::before { content: ''; position: absolute; top: 23px; left: -20px; width: 90px; height: 2px; background: rgba(255, 0, 0, 0.9); }
        #crosshair::after { content: ''; position: absolute; left: 23px; top: -20px; height: 90px; width: 2px; background: rgba(255, 0, 0, 0.9); }

        .bracket { position: absolute; width: 30px; height: 30px; border: 4px solid lime; z-index: 30; transition: all 1s cubic-bezier(0.25, 1, 0.5, 1); }
        #b-tl { top: 10%; left: 5%; border-right: none; border-bottom: none; }
        #b-tr { top: 10%; right: 5%; border-left: none; border-bottom: none; }
        #b-bl { bottom: 15%; left: 5%; border-right: none; border-top: none; }
        #b-br { bottom: 15%; right: 5%; border-left: none; border-top: none; }
        .locked #b-tl { top: 40%; left: 35%; border-color: red; }
        .locked #b-tr { top: 40%; right: 35%; border-color: red; }
        .locked #b-bl { bottom: 40%; left: 35%; border-color: red; }
        .locked #b-br { bottom: 40%; right: 35%; border-color: red; }

        #terminal { position: absolute; bottom: 20px; left: 5%; width: 85%; max-width: 500px; max-height: 20vh; overflow: hidden; z-index: 50; color: lime; font-size: 1rem; font-weight: bold; text-shadow: 0 0 5px #000; background: rgba(0,0,0,0.95); padding: 10px; border: 1px solid lime; border-left: 5px solid lime; box-shadow: 0 0 15px rgba(0,255,0,0.5); transition: opacity 0.5s; }
        #warning-banner { position: absolute; top: 25%; left: 0; width: 100%; background: rgba(255,0,0,0.9); color: white; text-align: center; font-size: 2rem; font-weight: bold; padding: 10px 0; z-index: 100; letter-spacing: 5px; display: none; animation: blink 0.5s infinite; }

        #massive-countdown { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 35vw; font-weight: 900; color: #ff0000; z-index: 200; text-shadow: 0 0 50px #ff0000, 0 0 100px #000; display: none; pointer-events: none; }
        .pop-animation { animation: popScale 0.9s ease-in-out; }

        #damage-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2500; display: none; pointer-events: none; mix-blend-mode: multiply; background: radial-gradient(circle, transparent 20%, rgba(80, 0, 0, 0.5) 70%, rgba(40, 0, 0, 0.95) 100%); }
        .blood-blob { position: absolute; background: #3a0000; filter: blur(2px); border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
        .blood-drip { position: absolute; background: #3a0000; width: 8px; border-radius: 4px; filter: blur(1px); animation: dripDown 4s forwards; }
        .crack { position: absolute; background: rgba(255,255,255,0.7); box-shadow: 0 0 8px rgba(255,255,255,0.5); transform-origin: top center; z-index: 2400; display: none; }
        
        #flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #ff0000; z-index: 2800; opacity: 0; pointer-events: none; display: none; }

        #birthday-msg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3000; display: none; flex-direction: column; align-items: center; justify-content: center; color: #fff; text-shadow: 0 0 20px #000, 0 0 10px #ff0000; text-align: center; padding: 20px; box-sizing: border-box;}
        .bday-title { font-size: 12vw; font-weight: 900; letter-spacing: 5px; margin-bottom: 20px; color: #ff0000; border-bottom: 2px solid #ff0000; padding-bottom: 10px; width: 90%; max-width: 600px;}
        .bday-sub { font-size: 6vw; font-weight: bold; letter-spacing: 3px; line-height: 1.5; color: #ccc;}
        .bday-highlight { font-size: 8vw; color: #fff; display: block; margin-top: 15px; text-shadow: 0 0 15px #ff0000; }
        @media (min-width: 768px) { .bday-title { font-size: 5rem; letter-spacing: 15px; } .bday-sub { font-size: 2rem; letter-spacing: 8px; } .bday-highlight { font-size: 3rem; } }

        @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes popScale { 0% { transform: translate(-50%, -50%) scale(2); opacity: 0; } 20% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 80% { transform: translate(-50%, -50%) scale(0.9); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(0); opacity: 0; } }
        @keyframes shake { 0% { transform: translate(3px, 3px); } 20% { transform: translate(-5px, 0px); } 40% { transform: translate(5px, -3px); } 60% { transform: translate(-5px, 3px); } 80% { transform: translate(3px, -3px); } 100% { transform: translate(-3px, 3px); } }
        @keyframes dripDown { 0% { height: 10px; opacity: 1; } 100% { height: 200px; opacity: 0.6; } }
        .shaking { animation: shake 0.2s infinite; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h1>ORBITAL STRIKE COMMAND</h1>
        <button onclick="requestUplink()">[ INITIALIZE UPLINK ]</button>
    </div>

    <div id="map-container">
        <div class="lens-dirt"></div>
        <div class="scanlines"></div>
        
        <div class="cam-ui" id="rec">🔴 REC</div>
        <div class="cam-ui" id="coords">UPLINKING...</div>
        <div id="data-stream"></div>
        
        <div class="bracket" id="b-tl"></div>
        <div class="bracket" id="b-tr"></div>
        <div class="bracket" id="b-bl"></div>
        <div class="bracket" id="b-br"></div>

        <div id="center-ui">
            <div id="radar"></div>
            <div id="crosshair"></div>
        </div>

        <div id="warning-banner">TARGET LOCK ACQUIRED</div>
        <div id="massive-countdown"></div>
        
        <div id="map"></div>
        <div id="terminal"></div>
    </div>

    <!-- The Damage Overlay -->
    <div id="damage-layer">
        <div class="blood-blob" style="top: -10%; left: -5%; width: 40vw; height: 35vw; transform: rotate(20deg);"></div>
        <div class="blood-blob" style="bottom: 10%; right: -10%; width: 50vw; height: 45vw; transform: rotate(-35deg);"></div>
        <div class="blood-blob" style="top: 40%; left: 70%; width: 25vw; height: 20vw; transform: rotate(80deg);"></div>
        
        <div class="blood-drip" style="top: 15%; left: 15%;"></div>
        <div class="blood-drip" style="top: 25%; left: 20%; animation-delay: 0.5s;"></div>
        <div class="blood-drip" style="top: 50%; right: 25%; animation-delay: 1s;"></div>
    </div>

    <div class="crack" id="c1" style="top: 50%; left: 50%; width: 3px; height: 60vh; transform: rotate(35deg);"></div>
    <div class="crack" id="c2" style="top: 50%; left: 50%; width: 2px; height: 45vh; transform: rotate(-75deg);"></div>
    <div class="crack" id="c3" style="top: 50%; left: 50%; width: 1px; height: 35vh; transform: rotate(145deg);"></div>

    <div id="flash"></div>
    
    <div id="birthday-msg">
        <div class="bday-title">TARGET: BROTHER</div>
        <div class="bday-sub">MISSION ACCOMPLISHED.<br><span class="bday-highlight">HAPPY BIRTHDAY.</span></div>
    </div>

    <script>
        let map;
        const terminal = document.getElementById('terminal');
        const mapDiv = document.getElementById('map');
        const bigCountdown = document.getElementById('massive-countdown');

        // ==========================================
        // SYNTHESIZED AUDIO ENGINE (NO MP3s NEEDED)
        // ==========================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let alarmInterval, heartbeatInterval;

        function playDistortedPulse(freq, duration, vol) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const distortion = audioCtx.createWaveShaper();
            
            // Hard distortion curve
            function makeDistortionCurve(amount) {
                const k = typeof amount === 'number' ? amount : 50, n_samples = 44100, curve = new Float32Array(n_samples), deg = Math.PI / 180;
                for (let i = 0 ; i < n_samples; ++i ) {
                    let x = i * 2 / n_samples - 1;
                    curve[i] = ( 3 + k ) * x * 20 * deg / ( Math.PI + k * Math.abs(x) );
                }
                return curve;
            }
            
            distortion.curve = makeDistortionCurve(400);
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + duration); // Pitch drop
            
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            
            osc.connect(distortion);
            distortion.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playNuclearKlaxon() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc1.type = 'sawtooth';
            osc2.type = 'sawtooth';
            
            // Dissonant sweeping frequencies
            osc1.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc1.frequency.linearRampToValueAtTime(400, audioCtx.currentTime + 0.8);
            osc2.frequency.setValueAtTime(615, audioCtx.currentTime); 
            osc2.frequency.linearRampToValueAtTime(385, audioCtx.currentTime + 0.8);
            
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.8);
            
            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(audioCtx.destination);
            osc1.start(); osc2.start();
            osc1.stop(audioCtx.currentTime + 0.8); osc2.stop(audioCtx.currentTime + 0.8);
        }

        function playKineticImpact() {
            const bufferSize = audioCtx.sampleRate * 3; // 3 seconds of noise
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; } // White noise
            
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1000, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 2);
            
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(1.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 2.5);
            
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start();
        }

        // ==========================================

        function requestUplink() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            // Start impending doom heartbeat
            let pulseSpeed = 1000;
            heartbeatInterval = setInterval(() => {
                playDistortedPulse(60, 0.4, 0.5);
            }, pulseSpeed);

            document.querySelector('button').innerText = "CALCULATING...";
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => { startTracking(position.coords.latitude, position.coords.longitude); },
                    (error) => { startTracking(28.6139, 77.2090); } 
                );
            } else {
                startTracking(28.6139, 77.2090);
            }
        }

        function startTracking(lat, lng) {
            document.getElementById('ui-layer').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('ui-layer').style.display = 'none';
                document.getElementById('map-container').style.display = 'block';
                initMap(lat, lng);
                runDataStream();
                runTerminalSequence();
                simulateCameraDrift();
            }, 1000);
        }

        function initMap(lat, lng) {
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([26.1830, 91.7400], 5);
            L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { maxZoom: 20 }).addTo(map);

            setTimeout(() => {
                map.flyTo([lat, lng], 19, { animate: true, duration: 6 });
                setInterval(() => {
                    let currentZoom = map.getZoom();
                    let fakeAlt = Math.max(1, 20 - currentZoom);
                    document.getElementById('coords').innerHTML = `ALT: 0.${fakeAlt}km<br>LAT: ${lat.toFixed(4)}<br>LNG: ${lng.toFixed(4)}`;
                }, 100);
            }, 1000);
        }

        function runDataStream() {
            const stream = document.getElementById('data-stream');
            setInterval(() => {
                let text = "";
                for(let i=0; i<30; i++) { text += Math.random().toString(16).substr(2, 6).toUpperCase() + "<br>"; }
                stream.innerHTML = text;
            }, 100); 
        }

        function triggerThermalGlitch() {
            playDistortedPulse(300, 0.2, 0.1); 
            let glitchCount = 0;
            let glitchInterval = setInterval(() => {
                mapDiv.classList.toggle('thermal-mode');
                glitchCount++;
                if(glitchCount > 5) clearInterval(glitchInterval);
            }, 150);
        }

        function simulateCameraDrift() {
            setTimeout(() => {
                setInterval(() => {
                    if(map.getZoom() >= 18) { map.panBy([Math.random() * 30 - 15, Math.random() * 30 - 15], {animate: true, duration: 1.5}); }
                }, 1500);
            }, 8000);
        }

        function runTerminalSequence() {
            const logs = [
                "IIT GUWAHATI DSAI COMMAND ESTABLISHED...",
                "INITIATING RAPID DESCENT PROTOCOL.",
                "OPTICS ACTIVE. LENS GRIME DETECTED.",
                "BYPASSING DELHI REGIONAL AIRSPACE...",
                "SCANNING FOR TARGET SIGNATURE...",
                "! THERMAL ANOMALY DETECTED !",
                "MATCH FOUND: BIOMETRIC LOCK SECURED.",
                "CALCULATING WIND RESISTANCE...",
                "EXECUTING KINETIC BOMBARDMENT."
            ];

            let delay = 0;
            logs.forEach((log, index) => {
                if(index === 5) delay += 2000; 
                else delay += 1200; 

                setTimeout(() => {
                    terminal.innerHTML += `> ${log}<br>`;
                    terminal.scrollTop = terminal.scrollHeight;
                    playDistortedPulse(800, 0.05, 0.05); // Terminal blip
                    
                    if (index === 5) triggerThermalGlitch();
                    if (index === 6) {
                        // Start Nuclear Klaxon
                        alarmInterval = setInterval(playNuclearKlaxon, 900);
                        document.getElementById('map-container').classList.add('locked');
                        document.getElementById('warning-banner').style.display = 'block';
                    }
                }, delay);
            });

            setTimeout(startMassiveCountdown, delay + 1000);
        }

        function startMassiveCountdown() {
            document.body.classList.add('shaking'); 
            bigCountdown.style.display = 'block';
            
            let count = 3;
            function showNumber() {
                if (count > 0) {
                    bigCountdown.innerText = count;
                    bigCountdown.classList.remove('pop-animation');
                    void bigCountdown.offsetWidth; 
                    bigCountdown.classList.add('pop-animation');
                    playDistortedPulse(150, 0.5, 0.8); // Bass drop per count
                    count--;
                    setTimeout(showNumber, 1000);
                } else {
                    triggerImpact();
                }
            }
            showNumber();
        }

        function triggerImpact() {
            document.body.classList.remove('shaking');
            clearInterval(heartbeatInterval);
            clearInterval(alarmInterval);
            
            playKineticImpact(); // Massive synthesized explosion

            const flash = document.getElementById('flash');
            const msg = document.getElementById('birthday-msg');
            const damage = document.getElementById('damage-layer');

            document.getElementById('center-ui').style.display = 'none';
            document.getElementById('massive-countdown').style.display = 'none';
            document.getElementById('warning-banner').style.display = 'none';
            document.getElementById('terminal').style.opacity = '0';

            flash.style.display = 'block';
            flash.style.opacity = '1';
            
            setTimeout(() => {
                flash.style.background = 'white'; 
                damage.style.display = 'block';
                document.getElementById('c1').style.display = 'block';
                document.getElementById('c2').style.display = 'block';
                document.getElementById('c3').style.display = 'block';
                
                msg.style.display = 'flex'; 
                
                flash.style.transition = 'opacity 1.5s ease-out';
                flash.style.opacity = '0';
            }, 100); 
        }
    </script>
</body>
</html>
